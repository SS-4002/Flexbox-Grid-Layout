<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css" rel="stylesheet">
        <title>Flexbox/Grid Layout</title>
    </head>
    <body>
        <!-- Header -->
        <header>
            <h1>Flexbox/Grid Layout</h1>
        </header>

        <!-- Desktop -->
        <section>
            <div class="rgb-boxes">
                <div class="red-box"></div>
                <div class="green-box"></div>
                <div class="blue-box"></div>
            </div>

            <div class="chocolate-boxes">
                <div class="choco-box"></div>
                <div class="choco-box"></div>
                <div class="choco-box"></div>
            </div>
        </section>

        <!-- Tablet -->
        <section>
            <div class="chess-board">
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
                <div class="white-square"></div>
                <div class="black-square"></div>
            </div>
        </section>

        <!-- Mobile -->
        <section>
            <div class="olympic-rings">
                <div class="blue-ring"></div>
                <div class="black-ring"></div>
                <div class="red-ring"></div>
                <div class="yellow-ring"></div>
                <div class="green-ring"></div>
            </div>
        </section>
    </body>
</html>
